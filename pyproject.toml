[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy"

[project]
name = "auto-router"
version = "M2.5"
description = "Auto Router AIHub V4.0 — New API enhancement layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "pydantic==2.10.4",
    "python-multipart==0.0.20",
    "aiosqlite==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["router*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 注意：pythonpath=["src"] 只把 src/ 加入搜索路径，
# 但 import router 会找 src/router/ 目录（不存在）。
# 仓库内测试依赖 tests/conftest.py 的 types.ModuleType("router") 兜底。
# 线上部署路径恰好叫 router/ 所以不受影响。
pythonpath = ["src"]

[tool.setuptools.package-data]
router = ["static/*.html"]
